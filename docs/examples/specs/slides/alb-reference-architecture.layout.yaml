# ALB 3-tier slide: Users → IGW → internet-facing ALB → one ASG / target group over two AZs → RDS Multi-AZ, with Route 53 and the regional services (ACM, WAF, CloudWatch, S3) in one column right of the VPC
name: alb-reference-architecture
mode: slide
cols: [users, r53, igw, pub, app1, app2, {id: db, min_w: 112}, svc]
rows: [az1, main, az2]

# The two AZs are written out instead of a `per: [az1, az2]` template: a template keeps
# equal top / bottom insets in both AZs, but here only AZ 1 holds the ASG header, so the
# template would add 16px of height and push the slide past 540.
groups:
  - {id: cloud,  type: cloud, pad: 5}   # 5, not 8: the 3px each side keeps the canvas ≤ 1108 wide
  - {id: region, type: region, label: Region, in: cloud}
  - {id: vpc,    type: vpc, label: VPC, cidr: 10.0.0.0/16, in: region, min_w: 721}   # room right of the replication line for its label
  - {id: az1,    type: az, label: Availability Zone 1, in: vpc}
  - {id: pubsn1, type: public, label: Public subnet, in: az1}
  - {id: appsn1, type: private, label: App subnet, in: az1}
  - {id: dbsn1,  type: private, label: DB subnet, in: az1}
  - {id: az2,    type: az, label: Availability Zone 2, in: vpc}
  - {id: pubsn2, type: public, label: Public subnet, in: az2}
  - {id: appsn2, type: private, label: App subnet, in: az2}
  - {id: dbsn2,  type: private, label: DB subnet, in: az2}
  - {id: asg,    type: asg, label: ASG · target group, over: [ec2a1, ec2b1, ec2a2, ec2b2], header: right}

nodes:
  - {id: users, icon: resource/Users, label: Users, at: [users, main]}
  - {id: r53,   icon: service/Amazon-Route-53, label: Route 53, sub: alias → ALB, in: cloud, at: [r53, az1], dy: -132}
  - {id: acm,   icon: service/AWS-Certificate-Manager, label: ACM, sub: 인증서, in: region, at: [svc, az1], dy: -110}
  - {id: waf,   icon: service/AWS-WAF, label: AWS WAF, sub: Web ACL, in: region, at: [svc, az1]}
  - {id: cw,    icon: service/Amazon-CloudWatch, label: CloudWatch, sub: 지표 · 경보, in: region, at: [svc, main], dy: 21}
  - {id: s3,    icon: service/Amazon-Simple-Storage-Service, label: S3, sub: 액세스 로그, in: region, at: [svc, az2]}
  - {id: nat1,  icon: resource/Amazon-VPC_NAT-Gateway, label: NAT gateway, in: pubsn1, at: [pub, az1]}
  - {id: ec2a1, icon: service/Amazon-EC2, label: EC2, in: appsn1, at: [app1, az1]}
  - {id: ec2b1, icon: service/Amazon-EC2, label: EC2, in: appsn1, at: [app2, az1]}
  - {id: rds1,  icon: service/Amazon-RDS, label: RDS Primary, in: dbsn1, at: [db, az1]}
  - {id: nat2,  icon: resource/Amazon-VPC_NAT-Gateway, label: NAT gateway, in: pubsn2, at: [pub, az2]}
  - {id: ec2a2, icon: service/Amazon-EC2, label: EC2, in: appsn2, at: [app1, az2]}
  - {id: ec2b2, icon: service/Amazon-EC2, label: EC2, in: appsn2, at: [app2, az2]}
  - {id: rds2,  icon: service/Amazon-RDS, label: RDS Standby, in: dbsn2, at: [db, az2]}
  - {id: alb,   icon: resource/Elastic-Load-Balancing_Application-Load-Balancer, label: ALB, in: vpc, at: [pub, main]}
  - {id: igw,   icon: resource/Amazon-VPC_Internet-Gateway, label: IGW, on: vpc, at: [igw, main]}

edges:
  - {e: "users -> igw", label: "HTTPS :443"}
  - {e: "igw -> alb"}
  - {e: "alb -> asg", label: "HTTP :80"}
  - {e: "asg -> rds1", label: SQL}
  - {e: "users ..> r53", verb: DNS 조회}
  - {e: "asg ..> nat1", verb: 아웃바운드}
  - {e: "asg ..> nat2", verb: 아웃바운드}
  - {e: "rds1 ..> rds2", verb: 동기식 복제, shape: HVH, from_side: right, to_side: right, from_offset: 12, to_offset: -12, bend_x: "rds1.x1+28"}
