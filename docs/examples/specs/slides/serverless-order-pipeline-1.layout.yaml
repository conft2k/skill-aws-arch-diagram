# are omitted across the pair. The document's nine prose steps are condensed into
# node/edge captions and two note lines to keep titled-slide text at least 10pt.
name: serverless-order-pipeline-1
mode: slide
cols: [users, edge, x0, x1, x2, x3, x4, x5]
