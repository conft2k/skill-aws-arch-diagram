# Centralized egress: App VPC A · B (per-AZ app + TGW subnets) → TGW (Spoke RT, Firewall RT) → Security VPC (TGW subnet → firewall subnet → public subnet with NAT, per AZ) → IGW → Internet
name: centralized-egress
mode: document
cols: [app, teni, tgw, {id: seni, min_gap_before: 345}, fw, nat, igw, inet]
rows: [a1, a2, main, b1, b2]

groups:
  - {id: cloud,  type: cloud}
  - {id: region, type: region, label: Region ap-northeast-2, in: cloud}
  - {id: vpca,   type: vpc, label: App VPC A, cidr: 10.1.0.0/16, in: region}
  - {id: aza,    type: az, in: vpca, per: [a1, a2]}
  - {id: appa,   type: private, label: App subnet, in: aza}
  - {id: tgwa,   type: private, label: TGW subnet, in: aza}
  - {id: vpcb,   type: vpc, label: App VPC B, cidr: 10.2.0.0/16, in: region}
  - {id: azb,    type: az, in: vpcb, per: [b1, b2]}
  - {id: appb,   type: private, label: App subnet, in: azb}
  - {id: tgwb,   type: private, label: TGW subnet, in: azb}
  - {id: sec,    type: vpc, label: Security VPC, cidr: 10.100.0.0/16, in: region}
  - {id: azs,    type: az, in: sec, per: [a2, b1]}
  - {id: tgwsn,  type: private, label: TGW subnet, in: azs}
  - {id: fwsn,   type: private, label: Firewall subnet, in: azs}
  - {id: pubsn,  type: public, label: Public subnet, in: azs}

nodes:
  - {id: ec2a,  icon: service/Amazon-EC2, label: EC2, sub: "0.0.0.0/0 → TGW", in: appa, col: app}
  - {id: enia,  icon: resource/AWS-Transit-Gateway_Attachment, label: TGW ENI, in: tgwa, col: teni}
  - {id: ec2b,  icon: service/Amazon-EC2, label: EC2, sub: "0.0.0.0/0 → TGW", in: appb, col: app}
  - {id: enib,  icon: resource/AWS-Transit-Gateway_Attachment, label: TGW ENI, in: tgwb, col: teni}
  - {id: tgw,   icon: service/AWS-Transit-Gateway, label: Transit Gateway, in: region, at: [tgw, main]}
  - {id: rtsp,  icon: resource/Amazon-Route-53_Route-Table, label: Spoke RT, sub: ["App VPC A · B attachment 연결", "0.0.0.0/0 → Security VPC"], in: region, at: [tgw, a2], for: [vpca, vpcb]}
  - {id: rtfw,  icon: resource/Amazon-Route-53_Route-Table, label: Firewall RT, sub: ["Security VPC attachment 연결", "10.1.0.0/16 → App VPC A", "10.2.0.0/16 → App VPC B"], in: region, at: [tgw, b1], for: [eni.1, eni.2]}
  - {id: eni,   icon: resource/AWS-Transit-Gateway_Attachment, label: TGW ENI, sub: "0.0.0.0/0 → 같은 AZ 방화벽", in: tgwsn, col: seni}
  - {id: fwe,   icon: resource/AWS-Network-Firewall_Endpoints, label: Firewall endpoint, sub: ["0.0.0.0/0 → 같은 AZ NAT", "10.0.0.0/8 → TGW"], in: fwsn, col: fw}
  - {id: nat,   icon: resource/Amazon-VPC_NAT-Gateway, label: NAT gateway, sub: ["0.0.0.0/0 → IGW", "10.0.0.0/8 → 같은 AZ 방화벽"], in: pubsn, col: nat}
  - {id: nfw,   icon: service/AWS-Network-Firewall, label: AWS Network Firewall, in: sec, at: [fw, main]}
  - {id: igw,   icon: resource/Amazon-VPC_Internet-Gateway, label: IGW, on: sec, at: [igw, main]}
  - {id: inet,  icon: resource/Internet, label: Internet, at: [inet, main]}

edges:
  - {e: "ec2a.* -> enia.*", step: 1}
  - {e: "ec2b.* -> enib.*"}
  - {e: "vpca <-> tgw", verb: VPC attachment, step: 2}
  - {e: "vpcb <-> tgw"}
  - {e: "tgw <-> eni.1", verb: appliance mode, label_at: above, step: 3, step_at: start, bend_x: "sec.x0-28"}
  - {e: "tgw <-> eni.2", bend_x: "sec.x0-28"}
  - {e: "eni.* <-> fwe.*", step: 4}
  - {e: "fwe.* -> nat.*", step: 5}
  - {e: "nat.* -> igw", trunk: true, step: 6}
  - {e: "igw -> inet"}

note:
  steps:
    - [EC2 → TGW ENI, "App VPC A의 App 서브넷 RT가 0.0.0.0/0을 TGW로 보내, 인터넷행 트래픽이 같은 AZ의 TGW 서브넷에 있는 TGW ENI로 갑니다."]
    - [App VPC A → TGW, "TGW는 App VPC A의 VPC attachment로 트래픽을 받고, 이 attachment에 연결된 Spoke RT로 다음 홉을 찾습니다."]
    - [TGW → Security VPC, "Spoke RT의 0.0.0.0/0이 Security VPC attachment를 가리킵니다. appliance mode로 한 흐름의 양방향이 같은 AZ의 TGW ENI를 지납니다."]
    - [TGW ENI → 방화벽, "Security VPC의 TGW 서브넷 RT 0.0.0.0/0이 같은 AZ의 Network Firewall 엔드포인트로 보내고, 방화벽이 정책에 따라 검사합니다."]
    - [방화벽 → NAT, "검사를 통과한 트래픽은 방화벽 서브넷 RT 0.0.0.0/0 → 같은 AZ NAT 게이트웨이로 가고, NAT가 출발지 주소를 퍼블릭 IP로 바꿉니다."]
    - [NAT → IGW → Internet, "퍼블릭 서브넷 RT 0.0.0.0/0 → IGW로 인터넷에 나갑니다. 응답은 10.0.0.0/8 → 같은 AZ 방화벽, 10.0.0.0/8 → TGW를 거쳐 Firewall RT의 10.1.0.0/16 → App VPC A로 돌아옵니다."]
