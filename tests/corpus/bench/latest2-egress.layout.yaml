# Centralized egress: App VPC A · B (2 AZs each: App subnet + TGW subnet) → TGW (Spoke RT, Firewall RT) → Security VPC over two AZs (TGW subnet → firewall subnet → public subnet with NAT) → IGW → Internet
name: centralized-egress
mode: document
cols: [ec2, speni, tgw, eni, fw, nat, igw, inet]
rows: [a1, a2, main, b1, b2]

groups:
  - {id: cloud,  type: cloud}
  - {id: region, type: region, label: Region ap-northeast-2, in: cloud}
  - {id: vpca,   type: vpc, label: App VPC A, cidr: 10.1.0.0/16, in: region}
  - {id: aza,    type: az, in: vpca, per: [a1, a2]}
  - {id: appa,   type: private, label: App subnet, in: aza}
  - {id: tgwa,   type: private, label: TGW subnet, in: aza}
  - {id: vpcb,   type: vpc, label: App VPC B, cidr: 10.2.0.0/16, in: region}
  - {id: azb,    type: az, in: vpcb, per: [b1, b2]}
  - {id: appb,   type: private, label: App subnet, in: azb}
  - {id: tgwb,   type: private, label: TGW subnet, in: azb}
  - {id: sec,    type: vpc, label: Security VPC, cidr: 10.100.0.0/16, in: region}
  - {id: az,     type: az, in: sec, per: [a2, b1]}
  - {id: tgwsn,  type: private, label: TGW subnet, in: az}
  - {id: fwsn,   type: private, label: Firewall subnet, in: az}
  - {id: pubsn,  type: public, label: Public subnet, in: az}

nodes:
  - {id: ec2a, icon: service/Amazon-EC2, label: EC2, sub: "0.0.0.0/0 → TGW", in: appa, col: ec2}
  - {id: enia, icon: resource/AWS-Transit-Gateway_Attachment, label: TGW ENI, in: tgwa, col: speni}
  - {id: ec2b, icon: service/Amazon-EC2, label: EC2, sub: "0.0.0.0/0 → TGW", in: appb, col: ec2}
  - {id: enib, icon: resource/AWS-Transit-Gateway_Attachment, label: TGW ENI, in: tgwb, col: speni}
  - {id: tgw,  icon: service/AWS-Transit-Gateway, label: TGW, in: region, at: [tgw, main]}
  - {id: rtsp, icon: resource/Amazon-Route-53_Route-Table, label: Spoke RT, sub: ["Spoke VPC attachment 연결", "0.0.0.0/0 → Security VPC"], in: region, at: [tgw, a2], for: [enia.1, enia.2, enib.1, enib.2]}
  - {id: rtfw, icon: resource/Amazon-Route-53_Route-Table, label: Firewall RT, sub: ["Security VPC attachment 연결", "10.1.0.0/16 → App VPC A", "10.2.0.0/16 → App VPC B"], in: region, at: [tgw, b1], for: [eni.1, eni.2]}
  - {id: eni,  icon: resource/AWS-Transit-Gateway_Attachment, label: TGW ENI, sub: "0.0.0.0/0 → 같은 AZ 방화벽", in: tgwsn, col: eni}
  - {id: fwe,  icon: resource/AWS-Network-Firewall_Endpoints, label: Firewall endpoint, sub: ["0.0.0.0/0 → 같은 AZ NAT", "10.0.0.0/8 → TGW"], in: fwsn, col: fw}
  - {id: nat,  icon: resource/Amazon-VPC_NAT-Gateway, label: NAT gateway, sub: ["0.0.0.0/0 → IGW", "10.0.0.0/8 → 같은 AZ 방화벽"], in: pubsn, col: nat}
  - {id: nfw,  icon: service/AWS-Network-Firewall, label: AWS Network Firewall, in: sec, at: [fw, main]}
  - {id: igw,  icon: resource/Amazon-VPC_Internet-Gateway, label: IGW, on: sec, at: [igw, main]}
  - {id: inet, icon: resource/Internet, label: Internet, at: [inet, main]}

edges:
  - {e: "ec2a.* -> enia.*", step: 1}
  - {e: "ec2b.* -> enib.*"}
  - {e: "enia.* -> tgw", trunk: true, verb: VPC attachment, step: 2}
  - {e: "enib.* -> tgw", trunk: true}
  - {e: "tgw <-> eni.1", verb: appliance mode, step: 3, step_at: start}
  - {e: "tgw <-> eni.2"}
  - {e: "eni.* <-> fwe.*", step: 4}
  - {e: "fwe.* -> nat.*", step: 5}
  - {e: "nat.* -> igw", trunk: true, step: 6}
  - {e: "igw -> inet"}

note:
  steps:
    - [EC2 → TGW ENI, "App VPC A의 App 서브넷 RT가 0.0.0.0/0을 TGW로 보내, 인터넷행 트래픽이 같은 AZ TGW 서브넷의 attachment ENI로 갑니다."]
    - [App VPC A → TGW, "VPC attachment로 TGW에 들어오고, Spoke VPC attachment에 연결된 Spoke RT의 0.0.0.0/0이 Security VPC attachment를 가리킵니다."]
    - [TGW → Security VPC, "Security VPC attachment는 appliance mode라 한 흐름의 양방향이 같은 AZ의 TGW ENI를 지나, 방화벽이 응답까지 같은 endpoint에서 봅니다."]
    - [TGW ENI → 방화벽, "TGW 서브넷 RT 0.0.0.0/0 → 같은 AZ firewall endpoint. AWS Network Firewall이 정책으로 검사하고 허용한 트래픽만 넘깁니다."]
    - [방화벽 → NAT, "방화벽 서브넷 RT 0.0.0.0/0 → 같은 AZ NAT 게이트웨이. NAT가 출발지 주소를 자신의 퍼블릭 IP로 바꿉니다."]
    - [NAT → IGW → Internet, "퍼블릭 서브넷 RT 0.0.0.0/0 → IGW로 인터넷에 나갑니다. 응답은 10.0.0.0/8 → 같은 AZ 방화벽, 방화벽 서브넷 10.0.0.0/8 → TGW, Firewall RT 10.1.0.0/16 → App VPC A 순으로 돌아옵니다."]
