# Not kept from the review scratch (about 440 spec files, 230 kept):
#   - exact duplicates (same content ignoring name and mode: the -document/-slide pairs,
#     probe dumps per render mode, copies between review folders): about 170
#   - copies or older revisions of the docs/examples specs (old4d3/, slides-specs-main/, ex/,
#     w1/, w2/, tgw_plain, gwlb_nopad, three bench2 copies, egress-nosp): covered by the
#     examples above
#   - rr-twin/*.layout.yaml: templates with unfilled MODE/ASGLINE placeholders (their filled
#     forms are the twin/ cases)
#   - review-lanes h120-h175: inner points of one min_gap_before sweep (h100, h150, h178 kept)
#   - rejections already covered by a kept reject/ case (ov1, ov2, srow2, xy_tmpl2,
#     v_colspan, x-three-step) or a large spec for a small rejection (review-lanes/f:
#     label_at: stem)
#   - var*.py mutations whose result equals a kept case; the scratch gen*.py that draw SVG
#     directly (no spec) and review-check/cases*.py (raw SVG check cases, no spec)
