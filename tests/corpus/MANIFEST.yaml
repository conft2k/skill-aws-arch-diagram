# Layout regression corpus: every case is run in each of its modes by tests/run_corpus.py.
#
#   path     the spec, relative to this file (examples: the docs/examples specs, by reference)
#   modes    document (--mode document), slide (--mode slide), slide-no-title (--mode slide
#            --no-title); defaults.modes when left out
#   expect   load (loads and a draft is drawn), reject (refused at load with a clear message)
#            or refuse (loads, but the solve refuses it, naming the contradictory constraints);
#            one value for every mode, or a map mode -> value; load when left out
#   rules    the user rules the case guards (judged by the rule checker, not yet by the runner):
#              R-flow   the flow reads exactly as the spec says (no line reads as another, no
#                       shared stem or merged lines that change the reading)
#              R-rt     a route table sits beside its associated object, inside the bracket
#                       its attachment lines draw
#              R-twin   identical structures (twin VPCs, subnets, AZs, overlays) are drawn
#                       the same shape
#              R-label  connector labels above horizontal / right of vertical lines; badges
#                       1:1 with note rows
#              R-border a connector does not read as part of a group's box: it keeps 12px from a
#                       border it runs along (check_layout LINE HUGS BORDER) and stays out of a
#                       group's header band (badge, title, CIDR line; user decision 2026-11-07)
#              R-fit    text meets the medium's target: ≥ 11px in a 760px document column,
#                       ≥ 10pt on a 1108 × 540 titled slide
#              R-reject the spec is rejected with a clear message
#   good     rules the case's drafts keep: the rule checker (scripts/rules.py) finds no
#            violation of them in any drawn run (the runner reports a run that disagrees)
#   bad      rule -> owner id (edge:3, node:rtsp, group:vpca), or a map of some of its
#            modes to one: rules its drafts break, each drawn run (of those modes) with a
#            violation of that rule naming that owner. Tag only what the draft shows, with
#            the reason in a comment
#   what     what the case exercises
#   match    text one of the run's lines must contain: a refusal's lines on a mode that
#            rejects or refuses (required there), the engine's warnings on a mode that loads
#            (what the solve moved); one text for the refusing modes (every mode when none
#            refuses), or a map mode -> text
#   known_fail  a recorded failure on the current engine (why, and what fixes it): reported as
#            known instead of failing the run, and reported once it passes again
#   note     why an expectation other than load holds
#   from     where the repro came from (reviewer scratch name), for history only
