  # QA backlog repros (2026-11-07): preserve the submitted specs; originals when reduction loses the defect.
  # 규칙 위반이 있어도 `Layout OK`: F3/F5가 나와도 exit 0이라 사용자는 끝났다고 믿습니다.
  # rules.py 미검출: success-summary semantics; false-junction below has F5 and Layout OK / exit 0.
  # Slide size failures in the docs/examples are guarded by R-fit tags on their references below; do not duplicate their specs.
  # 작성 안내 부족(처음 사용자): multi-account 작성 패턴, CloudFront VPC origin → internal ALB 예제,
  # DX+VPN+TGW 2개 RT 패턴, Route 53 Resolver inbound/outbound 아이콘 검색 결과 없음, F3/F5에 `fix:` 안내 없음,
  # `rule:`의 펼친 edge 번호와 YAML `edges[n]` 번호가 다름, 범례 hop이 표시 이름 대신 node ID.
  # rules.py 미검출: authoring guidance has no draft rule; original QA specs retain the relevant flows.
  # 3 AZ 큰 그림에서 AZ 3 → DB 선이 AZ 2 서버를 지나갑니다(T4 large_3az). 축소본 three_az_writer_9nodes에서는 Endpoint/Aurora reader를 관통합니다.
  # line-cross 01: F6 reports each crossing (edge, crossed node); the B2/F5 diagnostics are separate defects.
  # line-cross 03: the shape move steps every orders.* line out of its server's bottom into the writer's left side on
  # the document (F6 5 → 0, no rule violation left, PNG checked); on both slides orders.3 has no clean lane below
  # its AZ row, so the move adds a tier-0 violation and is not taken there.
  - path: qa/t4-three-az-writer.layout.yaml
    rules: [R-flow]
    what: "9-node reduction: writer traffic crosses Endpoint/Aurora reader icons"
    bad: {R-flow: {slide: node:db.2, slide-no-title: node:db.2}}   # F6: the orders.* -> db.1 lines run over Aurora reader 2 (and Endpoint 2/3, Aurora reader 3) along their AZ rows; the step-around candidates for orders.3 are all unclean and the one for orders.2 adds F5/L1, so selection keeps it; try: move db.2 / edges[0] bend_x
  - path: qa/lc-three-az-writer-clear.layout.yaml
    rules: [R-flow]
    good: [R-flow]
    what: "good pair of t4-three-az-writer: each order server writes to the Aurora instance in its own AZ; no line over an endpoint or database"
  # NAT trunk가 Route-Table 아이콘을 관통합니다(T3 nat-route-table).
  # line-cross 01: F6 reports the slide LINE OVER ICON as (edge, route table).
  # line-cross 03: the shape move steps nat.1 out of its bottom, under NAT RT 1's name, into the IGW (F6 (0, rt.1)
  # removed on both slides, PNG checked); nat.2 has no clean lane in AZ 2 and keeps its crossing.
  - path: qa/t3-nat-route-table.layout.yaml
    rules: [R-flow]
    what: "5-node NAT trunk crosses route-table icons on slides"
    bad: {R-flow: {slide: node:rt.2, slide-no-title: node:rt.2}}   # F6: nat.2 -> igw runs over NAT RT 2 on AZ 2's row; its step-around candidates are unclean (subnet header above, box border below); try: rt.2 dy / shape
  - path: qa/lc-nat-route-table-clear.layout.yaml
    rules: [R-flow]
    good: [R-flow]
    what: "good pair of t3-nat-route-table: the route table sits left of the NAT gateway, off the NAT -> IGW trunk"
  # DNS outbound가 inbound 아이콘을 관통합니다(T3 dns-trunk).
  # line-cross 01: F6 reports the icon crossings; F1 separately detects the shared segments.
  # line-cross 03: the shape move steps both outbound.* members off their AZ rows and merges them on one leg into the
  # VGW (F6 2 → 0 and F1 2 → 0 on both slides, PNG checked): R-flow is now kept in every mode.
  - path: qa/t3-dns-trunk.layout.yaml
    rules: [R-flow]
    what: "5-node outbound DNS trunk crosses inbound ENIs on slides (F6; F1 separately detects shared ingress segments)"
    good: [R-flow]
  - path: qa/lc-dns-trunk-clear.layout.yaml
    rules: [R-flow]
    good: [R-flow]
    what: "good pair of t3-dns-trunk: the outbound ENIs sit between the VGW and the inbound ENIs; the outbound trunk crosses no icon"
  # SSM trunk가 서비스 라벨을 관통합니다(T3 ssm-trunk).
  # line-cross 01: F6 reports a trunk member over its own end's name (own ends are exempt only where they attach).
  # line-cross 02: the channel move (wider endpoint → service gap, stem bend searched along both members) clears the
  # crossing on both slide modes (F6 1 → 0, drafts checked as PNG); R-flow stays bad for the label F5 that main has too.
  - path: qa/t3-ssm-trunk.layout.yaml
    rules: [R-flow]
    what: "6-node SSM trunk crossed the Session Manager service label on slides (cleared in line-cross 02); the endpoint HTTPS label reads as the Engineer line's"
    bad: {R-flow: {slide: edge:2, slide-no-title: edge:2}}   # F5 (edge:2, edge:0): edge:2's 'HTTPS :443' sits 8px from edge:0's line, 6px from its own; was F6 node:ssm before line-cross 02
  - path: qa/lc-ssm-trunk-clear.layout.yaml
    rules: [R-flow]
    good: [R-flow]
    what: "good pair of t3-ssm-trunk: the endpoints reach Session Manager as two lines (no trunk), no stem across its name"
  - path: qa/lc-own-end-touch.layout.yaml
    rules: [R-flow]
    good: [R-flow]
    what: "lines touch their own end icons only where they attach: a pinned headless line ends 1px into the database icon's side, an arrow stops at the cache's side, a line leaves from under the client's three-line name"
  # PrivateLink S3 경로가 다른 endpoint를 관통합니다(T1 privatelink slide).
  # line-cross 01: F6 reports the icon/text crossings; F1/F3/F5 and FIT are separate diagnostics.
  - path: qa/t1-privatelink.layout.yaml
    rules: [R-flow, R-fit]
    what: "Original PrivateLink: consumer B S3 path crosses another endpoint on a slide; no equivalent reduction"
    bad: {R-flow: {slide: node:s3a, slide-no-title: node:s3a}}   # F6: the hand-placed s3b ..> s3 VHV (shape / bend_y / from_side / to_side) runs up through S3 gateway EP a and across S3's own icon; hand placement is not rerouted; try: from_side / shape, or s3a dx
  - path: qa/lc-privatelink-clear.layout.yaml
    rules: [R-flow]
    good: [R-flow]
    what: "good pair of t1-privatelink: the second gateway endpoint's hand-placed HV leaves its right side into S3's bottom, clear of the first endpoint in the same column"
  # 복제 라벨이 SQL/요청 선에 더 가깝습니다(T2 repro-badge-replication, T3 cache-label).
  # Smallest submitted reproduction: cache-label has 6 nodes, versus badge-replication's 7.
  - path: qa/t3-cache-label.layout.yaml
    rules: [R-flow]
    what: "6-node reduction: DB/cache replication labels attach to request traffic"
    bad: {R-flow: {slide: edge:3, slide-no-title: edge:3}}   # F5: Async replication still touches the SQL flow; no budgeted candidate clears it; try edge:3 label_at or routing hints
  # DR 복제 배지가 NLB 선에 0px로 붙습니다(T1 multiregion-dr).
  # DNS 제어선과 앱 선이 한 선처럼 이어집니다(T1 multiregion-dr slide).
  # 문서용 예제 spec을 `--mode slide`로 그리면 8pt 하한 아래로 남는 것이 있습니다.
  - path: qa/t1-multiregion-dr.layout.yaml
    rules: [R-flow, R-fit]
    what: "Original DR: replication badge touches NLB traffic; slide DNS control and app paths read as one line; page/slide text is below target; no equivalent reduction"
    good: [R-flow]   # ticket 10 exception: the F2-removing slide repair shrinks only with a strict tier-0 count reduction
    bad:
      R-fit: canvas
  # DLQ의 "5회 실패 후 이동" 라벨이 자기 선보다 다른 선에 더 가깝습니다(T4 shared_lane_5nodes).
  - path: qa/t4-shared-lane.layout.yaml
