name: centralized-egress
mode: document
cols:
- inet
- igw
- nat
- fw
- seni
- rtfw
- tgw
- rtsp
- att
- ec2
rows:
- a1
- a2
- main
- b1
- b2
groups:
- id: cloud
  type: cloud
- id: region
  type: region
  label: Region ap-northeast-2
  in: cloud
- id: vpca
  type: vpc
  label: App VPC A
  cidr: 10.1.0.0/16
  in: region
- id: aza
  type: az
  in: vpca
  per:
  - a1
  - a2
- id: appa
  type: private
  label: App subnet
  in: aza
- id: tsna
  type: private
  label: TGW subnet
  in: aza
- id: vpcb
  type: vpc
  label: App VPC B
  cidr: 10.2.0.0/16
  in: region
- id: azb
  type: az
  in: vpcb
  per:
  - b1
  - b2
- id: appb
  type: private
  label: App subnet
  in: azb
- id: tsnb
  type: private
  label: TGW subnet
  in: azb
- id: sec
  type: vpc
  label: Security VPC
  cidr: 10.100.0.0/16
  in: region
- id: azs
  type: az
  in: sec
  per:
  - a2
  - b1
- id: tsns
  type: private
  label: TGW subnet
  in: azs
- id: fwsn
  type: private
  label: Firewall subnet
  in: azs
- id: pubsn
  type: public
  label: Public subnet
  in: azs
nodes:
- id: ec2a
  icon: service/Amazon-EC2
  label: EC2
  sub: 0.0.0.0/0 → TGW
  in: appa
  col: ec2
- id: enia
  icon: resource/AWS-Transit-Gateway_Attachment
  label: TGW ENI
  in: tsna
  col: att
- id: ec2b
  icon: service/Amazon-EC2
  label: EC2
  sub: 0.0.0.0/0 → TGW
  in: appb
  col: ec2
- id: enib
  icon: resource/AWS-Transit-Gateway_Attachment
  label: TGW ENI
  in: tsnb
  col: att
- id: rtsp
  icon: resource/Amazon-Route-53_Route-Table
  label: Spoke RT
  sub:
  - '연결: App VPC A · B'
  - 0.0.0.0/0 → Security VPC
  in: region
  at:
  - rtsp
  - main
- id: tgw
  icon: service/AWS-Transit-Gateway
  label: Transit Gateway
  in: region
  at:
  - tgw
  - main
- id: rtfw
  icon: resource/Amazon-Route-53_Route-Table
  label: Firewall RT
  sub:
  - '연결: Security VPC'
  - 10.1.0.0/16 → App VPC A
  - 10.2.0.0/16 → App VPC B
  in: region
  at:
  - rtfw
  - main
- id: seni
  icon: resource/AWS-Transit-Gateway_Attachment
  label: TGW ENI
  sub: 0.0.0.0/0 → 방화벽
  in: tsns
  col: seni
- id: fwe
  icon: resource/AWS-Network-Firewall_Endpoints
  label: Firewall endpoint
  sub:
  - 0.0.0.0/0 → NAT
  - 10.0.0.0/8 → TGW
  in: fwsn
  col: fw
- id: nat
  icon: resource/Amazon-VPC_NAT-Gateway
  label: NAT gateway
  sub:
  - 0.0.0.0/0 → IGW
  - 10.0.0.0/8 → 방화벽
  in: pubsn
  col: nat
- id: nfw
  icon: service/AWS-Network-Firewall
  label: AWS Network Firewall
  in: sec
  at:
  - fw
  - main
- id: igw
  icon: resource/Amazon-VPC_Internet-Gateway
  label: IGW
  'on': sec
  at:
  - igw
  - main
- id: inet
  icon: resource/Internet
  label: Internet
  at:
  - inet
  - main
edges:
- e: ec2a.* -> enia.*
  step: 1
- e: enia.* -> tgw
  trunk: true
  verb: VPC attachment
  step: 2
- e: ec2b.* -> enib.*
- e: enib.* -> tgw
  trunk: true
  verb: VPC attachment
- e: tgw -> seni.1
  verb: appliance mode
  step: 3
- e: tgw -> seni.2
- e: seni.* -> fwe.*
  step: 4
- e: fwe.* -> nat.*
  step: 5
- e: nat.* -> igw
  trunk: true
  step: 6
- e: igw -> inet
note:
  steps:
  - - EC2 → TGW ENI
    - App VPC A의 App 서브넷 RT가 0.0.0.0/0을 TGW로 보내, 인터넷행 트래픽이 같은 AZ의 TGW 서브넷에 있는 TGW ENI로 갑니다.
  - - TGW ENI → TGW
    - 트래픽이 App VPC A의 VPC attachment로 TGW에 들어오고, 이 attachment에 연결된 Spoke RT에서 다음 홉을 찾습니다.
  - - TGW → Security VPC
    - Spoke RT의 0.0.0.0/0이 Security VPC attachment를 가리킵니다. appliance mode로 한 흐름의 양방향이 같은 AZ의 TGW ENI와 방화벽을 지납니다.
  - - TGW ENI → 방화벽
    - Security VPC의 TGW 서브넷 RT가 0.0.0.0/0을 같은 AZ의 방화벽 엔드포인트로 보내고, AWS Network Firewall이 정책에 따라 검사합니다.
  - - 방화벽 → NAT
    - 검사를 통과한 트래픽은 방화벽 서브넷 RT 0.0.0.0/0 → 같은 AZ NAT 게이트웨이로 가고, NAT가 출발지 주소를 퍼블릭 IP로 바꿉니다.
  - - NAT → IGW → Internet
    - 퍼블릭 서브넷 RT 0.0.0.0/0 → IGW로 인터넷에 나갑니다. 응답은 퍼블릭 서브넷 RT 10.0.0.0/8 → 방화벽, 방화벽 서브넷 RT 10.0.0.0/8 → TGW를 거쳐 Firewall RT의 10.1.0.0/16 → App VPC A로 돌아갑니다.
