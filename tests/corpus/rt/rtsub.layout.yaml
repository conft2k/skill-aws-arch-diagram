name: nfw-reference-architecture
mode: slide
cols:
- spoke
- rtsp
- tgw
- rtfw
- eni
- fw
- nat
- igw
- inet
rows:
- az1
- main
- az2
groups:
- id: cloud
  type: cloud
- id: region
  type: region
  label: Region ap-northeast-2
  in: cloud
- id: vpca
  type: vpc
  label: VPC A
  cidr: 10.1.0.0/16
  in: region
- id: sna
  type: private
  label: Subnet
  in: vpca
- id: vpcb
  type: vpc
  label: VPC B
  cidr: 10.2.0.0/16
  in: region
- id: snb
  type: private
  label: Subnet
  in: vpcb
- id: insp
  type: vpc
  label: Inspection VPC
  cidr: 100.64.0.0/16
  in: region
- id: az
  type: az
  in: insp
  per:
  - az1
  - az2
- id: tgwsn
  type: private
  label: TGW subnet
  in: az
- id: fwsn
  type: private
  label: Firewall subnet
  in: az
- id: pubsn
  type: public
  label: Public subnet
  in: az
nodes:
- id: ec2a
  icon: service/Amazon-EC2
  label: EC2
  in: sna
  at:
  - spoke
  - az1
- id: ec2b
  icon: service/Amazon-EC2
  label: EC2
  in: snb
  at:
  - spoke
  - az2
- id: tgw
  icon: service/AWS-Transit-Gateway
  label: TGW
  in: region
  at:
  - tgw
  - main
- id: rtfw
  icon: resource/Amazon-Route-53_Route-Table
  label: Firewall RT
  sub: VPC A · B 전파
  in: region
  at:
  - rtfw
  - main
- id: rtsp
  icon: resource/Amazon-Route-53_Route-Table
  label: Spoke RT
  in: region
  at:
  - rtsp
  - main
  sub: 0.0.0.0/0 → 검사 VPC
- id: eni
  icon: resource/AWS-Transit-Gateway_Attachment
  label: TGW ENI
  in: tgwsn
  col: eni
- id: fwe
  icon: resource/AWS-Network-Firewall_Endpoints
  label: Firewall endpoint
  in: fwsn
  col: fw
- id: nat
  icon: resource/Amazon-VPC_NAT-Gateway
  label: NAT gateway
  in: pubsn
  col: nat
- id: nfw
  icon: service/AWS-Network-Firewall
  label: AWS Network Firewall
  in: insp
  at:
  - fw
  - main
- id: igw
  icon: resource/Amazon-VPC_Internet-Gateway
  label: IGW
  'on': insp
  at:
  - igw
  - main
- id: inet
  icon: resource/Internet
  label: Internet
  at:
  - inet
  - main
edges:
- e: vpca <-> tgw
  step: 1
- e: vpcb <-> tgw
- e: tgw <-> eni.1
  shape: VH
  verb: VPC attachment
  step: 2
  step_at: start
- e: tgw <-> eni.2
  shape: VH
- e: eni.* <-> fwe.*
  step: 3
- e: fwe.* -> nat.*
  step: 4
- e: nat.* -> igw
  trunk: true
  step: 5
- e: igw -> inet
note:
  steps:
  - - VPC → TGW
    - ''
  - - Spoke RT
    - 0.0.0.0/0 → 검사 VPC (appliance mode)
  - - 같은 AZ 방화벽에서 검사
    - (VPC 간은 TGW로 반환)
  - - 방화벽 → NAT
    - (인터넷행)
  - - NAT → IGW
    - ''
