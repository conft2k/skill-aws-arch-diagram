# Companion of timing-mirrored-az-rows: the same Inspection VPC nat column with both AZs in
# one row order (AZ 1 = public row a1 above appliance row a2; AZ 2 = public b1 above
# appliance b2). The AZ titles differ only by their number, so the two AZs are twins and
# are drawn alike.
name: same-order-az-rows
mode: document
cols: [nat]
rows: [a1, a2, b1, b2]
groups:
  - {id: insp,  type: vpc, label: Inspection VPC}
  - {id: azi1,  type: az, label: Availability Zone 1, in: insp}
  - {id: pubi1, type: public, label: Public subnet, in: azi1}
  - {id: apsn1, type: private, label: Appliance subnet, in: azi1}
  - {id: azi2,  type: az, label: Availability Zone 2, in: insp}
  - {id: pubi2, type: public, label: Public subnet, in: azi2}
  - {id: apsn2, type: private, label: Appliance subnet, in: azi2}
nodes:
  - {id: nat1, icon: resource/Amazon-VPC_NAT-Gateway, label: NAT gateway, in: pubi1, at: [nat, a1]}
  - {id: fw1,  icon: service/Amazon-EC2, label: 방화벽, in: apsn1, at: [nat, a2]}
  - {id: nat2, icon: resource/Amazon-VPC_NAT-Gateway, label: NAT gateway, in: pubi2, at: [nat, b1]}
  - {id: fw2,  icon: service/Amazon-EC2, label: 방화벽, in: apsn2, at: [nat, b2]}
edges: []
