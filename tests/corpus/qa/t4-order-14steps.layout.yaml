note:
  steps:
  - - users → cf
    - HTTPS :443 주문 요청
  - - cf → api
    - 캐시를 우회하여 API 호출
  - - api → ingest
    - 유효성 검증 및 주문 ID 발급
  - - ingest → queue
    - 주문 ID를 메시지로 적재
  - - queue → worker
    - 최소 1회 배달 · 멱등성 검사
  - - worker → db
    - 조건부 쓰기로 중복 주문 방지
  - - db → stream
    - 변경 이벤트 생성
  - - stream → pipes
    - INSERT 레코드 필터 및 변환
  - - pipes → bus
    - 주문 완료 이벤트 전달
  - - bus → notifyq
    - 규칙으로 알림 큐에 적재
  - - notifyq → notifyfn
    - 배치 메시지 처리 및 재시도
  - - notifyfn → sns
    - 구독자에게 알림 배포
  - - sns → mailfn
    - 이메일 구독 함수 실행
  - - mailfn → ses
    - HTTPS API로 고객에게 발송
