    <text x="500.4" y="870" font-size="28" fill="#545B64">VPN attachment로 TGW A에 들어오고, 온프레미스 경로는 BGP로 TGW A RT에 전파됩니다. 스포크 VPC 서브넷 RT: 10.0.0.0/8 · 192.168.0.0/16 → TGW.</text>
    <circle cx="90" cy="917" r="24" fill="#232F3E"/>
    <text x="90" y="927" font-size="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
    <text x="133" y="927" font-size="28" fill="#232F3E" font-weight="600">TGW A → TGW B</text>
    <text x="500.4" y="927" font-size="28" fill="#545B64">TGW A RT의 정적 경로 10.16.0.0/13 → peering으로 AWS 백본을 거쳐 ap-northeast-1의 TGW B에 닿습니다. 피어링은 경로 전파가 없어 양쪽 다 정적 경로입니다.</text>
    <circle cx="90" cy="974" r="24" fill="#232F3E"/>
    <text x="90" y="984" font-size="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
    <text x="133" y="984" font-size="28" fill="#232F3E" font-weight="600">TGW B → DR VPC</text>
    <text x="500.4" y="984" font-size="28" fill="#545B64">TGW B RT에 전파된 10.16.0.0/16 경로로 VPC attachment를 지나 DR VPC에 닿고, 반환은 TGW B RT의 정적 경로 192.168.0.0/16 → peering으로 같은 길입니다.</text>
