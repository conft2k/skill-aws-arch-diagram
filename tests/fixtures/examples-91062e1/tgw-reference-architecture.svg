    <text x="90" y="813" font-size="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
    <text x="133" y="813" font-size="28" fill="#232F3E" font-weight="600">Customer gateway → VPN</text>
    <text x="500.4" y="813" font-size="28" fill="#545B64">온프레미스 192.168.0.0/16의 트래픽을 고객 게이트웨이가 IPsec 터널로 Site-to-Site VPN에 보내고, 두 쪽은 BGP로 경로를 교환합니다.</text>
    <circle cx="90" cy="860" r="24" fill="#232F3E"/>
    <text x="90" y="870" font-size="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
