<svg viewBox="0 0 1214 792" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK KR', 'Pretendard', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#232F3E"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#232F3E"/>
    </marker>
  </defs>
  <rect width="1214" height="792" fill="#FFFFFF"/>

  <!-- ===== Users (outside AWS), on the main line y=346 shared with the IGW and the GWLB ===== -->
  <image href="bundle:resource/Users" x="16" y="322" width="48" height="48"/>
  <text x="40" y="388" font-size="14" text-anchor="middle" fill="#232F3E">Users</text>

  <g transform="translate(40,0)">
  <!-- ===== AWS Cloud ===== -->
  <rect x="120" y="16" width="1038" height="628" fill="none" stroke="#232F3E" stroke-width="2"/>
  <image href="bundle:group/AWS-Cloud-logo_32" x="120" y="16" width="32" height="32"/>
  <text x="162" y="38" font-size="15" fill="#232F3E" font-weight="600">AWS Cloud</text>

  <!-- ===== Region ===== -->
  <rect x="140" y="56" width="998" height="568" fill="none" stroke="#00A4A6" stroke-width="2" stroke-dasharray="3,3"/>
  <image href="bundle:group/Region_32" x="140" y="56" width="24" height="24"/>
  <text x="172" y="74" font-size="14" fill="#00A4A6" font-weight="600">Region</text>

  <!-- ===================== Application VPC (service consumer) ===================== -->
  <rect x="200" y="88" width="508" height="516" fill="none" stroke="#8C4FFF" stroke-width="2"/>
  <image href="bundle:group/Virtual-private-cloud-VPC_32" x="200" y="88" width="24" height="24"/>
  <text x="232" y="106" font-size="14" fill="#8C4FFF" font-weight="600">Application VPC</text>
  <text x="232" y="122" font-size="12" fill="#232F3E">10.0.0.0/16</text>

  <rect x="220" y="134" width="468" height="166" fill="none" stroke="#00A4A6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="232" y="152" font-size="14" fill="#00A4A6" font-weight="600">Availability Zone 1</text>
  <rect x="220" y="418" width="468" height="166" fill="none" stroke="#00A4A6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="232" y="436" font-size="14" fill="#00A4A6" font-weight="600">Availability Zone 2</text>

  <!-- tier columns: GWLBe subnet (236–488, public: 0.0.0.0/0 → IGW) → app subnet (520–672, private: 0.0.0.0/0 → GWLBe).
       GWLBe sits right of the header labels (which end near x=365) so the vertical
       connectors into AZ2 (x=384 and x=440) never cross them. -->
  <rect x="236" y="164" width="252" height="120" fill="none" stroke="#7AA116" stroke-width="1.5"/>
  <image href="bundle:group/Public-subnet_32" x="236" y="164" width="24" height="24"/>
  <text x="268" y="182" font-size="14" fill="#7AA116" font-weight="600">GWLBe subnet</text>
  <rect x="520" y="164" width="152" height="120" fill="none" stroke="#00A4A6" stroke-width="1.5"/>
  <image href="bundle:group/Private-subnet_32" x="520" y="164" width="24" height="24"/>
  <text x="552" y="182" font-size="14" fill="#00A4A6" font-weight="600">App subnet</text>

  <rect x="236" y="448" width="252" height="120" fill="none" stroke="#7AA116" stroke-width="1.5"/>
  <image href="bundle:group/Public-subnet_32" x="236" y="448" width="24" height="24"/>
  <text x="268" y="466" font-size="14" fill="#7AA116" font-weight="600">GWLBe subnet</text>
  <rect x="520" y="448" width="152" height="120" fill="none" stroke="#00A4A6" stroke-width="1.5"/>
  <image href="bundle:group/Private-subnet_32" x="520" y="448" width="24" height="24"/>
  <text x="552" y="466" font-size="14" fill="#00A4A6" font-weight="600">App subnet</text>

  <!-- GWLB endpoints: zonal, one per AZ -->
  <image href="bundle:resource/Amazon-VPC_Endpoints" x="416" y="198" width="48" height="48"/>
  <text x="440" y="264" font-size="14" text-anchor="middle" fill="#232F3E">GWLBe</text>
  <image href="bundle:resource/Amazon-VPC_Endpoints" x="416" y="482" width="48" height="48"/>
  <text x="440" y="548" font-size="14" text-anchor="middle" fill="#232F3E">GWLBe</text>

  <!-- application servers -->
  <image href="bundle:service/Amazon-EC2" x="572" y="198" width="48" height="48"/>
  <text x="596" y="264" font-size="14" text-anchor="middle" fill="#232F3E">EC2</text>
  <image href="bundle:service/Amazon-EC2" x="572" y="482" width="48" height="48"/>
  <text x="596" y="548" font-size="14" text-anchor="middle" fill="#232F3E">EC2</text>

  <!-- IGW on the Application VPC left border, on the main line y=346 with Users and the GWLB -->
  <rect x="176" y="322" width="48" height="72" fill="#FFFFFF"/>
  <image href="bundle:resource/Amazon-VPC_Internet-Gateway" x="176" y="322" width="48" height="48"/>
  <text x="200" y="388" font-size="14" text-anchor="middle" fill="#232F3E">IGW</text>

  <!-- ===================== Security VPC (service provider) ===================== -->
  <rect x="740" y="88" width="378" height="516" fill="none" stroke="#8C4FFF" stroke-width="2"/>
  <image href="bundle:group/Virtual-private-cloud-VPC_32" x="740" y="88" width="24" height="24"/>
  <text x="772" y="106" font-size="14" fill="#8C4FFF" font-weight="600">Security VPC</text>
  <text x="772" y="122" font-size="12" fill="#232F3E">10.1.0.0/16</text>

  <rect x="760" y="134" width="338" height="166" fill="none" stroke="#00A4A6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="772" y="152" font-size="14" fill="#00A4A6" font-weight="600">Availability Zone 1</text>
  <rect x="760" y="418" width="338" height="166" fill="none" stroke="#00A4A6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="772" y="436" font-size="14" fill="#00A4A6" font-weight="600">Availability Zone 2</text>

  <rect x="776" y="164" width="306" height="120" fill="none" stroke="#00A4A6" stroke-width="1.5"/>
  <image href="bundle:group/Private-subnet_32" x="776" y="164" width="24" height="24"/>
  <text x="808" y="182" font-size="14" fill="#00A4A6" font-weight="600">Appliance subnet</text>
  <rect x="776" y="448" width="306" height="120" fill="none" stroke="#00A4A6" stroke-width="1.5"/>
  <image href="bundle:group/Private-subnet_32" x="776" y="448" width="24" height="24"/>
  <text x="808" y="466" font-size="14" fill="#00A4A6" font-weight="600">Appliance subnet</text>

  <!-- one appliance Auto Scaling group spanning both AZ rows (8px inside the subnet borders); appliances on the app-tier rows, 8px inside the ASG's right border and 10px+ right of the 'ASG' label -->
  <rect x="944" y="172" width="130" height="388" fill="none" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="6,3"/>
  <image href="bundle:group/Auto-Scaling-group_32" x="944" y="172" width="24" height="24"/>
  <text x="976" y="190" font-size="14" fill="#ED7100" font-weight="600">ASG</text>
  <image href="bundle:service/Amazon-EC2" x="1014" y="198" width="48" height="48"/>
  <text x="1038" y="264" font-size="14" text-anchor="middle" fill="#232F3E">방화벽</text>
  <image href="bundle:service/Amazon-EC2" x="1014" y="482" width="48" height="48"/>
  <text x="1038" y="548" font-size="14" text-anchor="middle" fill="#232F3E">방화벽</text>

  <!-- one GWLB, in the gap between the AZ rows; left of centre so the GENEVE hop to the ASG has room for badge 3 and its label side by side above the line -->
  <image href="bundle:resource/Elastic-Load-Balancing_Gateway-Load-Balancer" x="772" y="322" width="48" height="48"/>
  <text x="796" y="388" font-size="14" text-anchor="middle" fill="#232F3E">GWLB</text>

  <!-- ===== main path, pointing right: IGW → GWLBe → EC2 (after inspection) ===== -->
  <polyline points="228,346 384,346 384,222 412,222" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="228,346 384,346 384,506 412,506" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="222" x2="568" y2="222" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="506" x2="568" y2="506" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== inspection detour (both directions): GWLBe ⇄ GWLB ⇄ appliances ===== -->
  <!-- GWLBe ⇄ GWLB runs over PrivateLink (no protocol label); same two-way arrow in both AZs,
       each entering the GWLB separately 8px above / below its centre -->
  <polyline points="768,338 440,338 440,272" fill="none" stroke="#232F3E" stroke-width="1.5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <polyline points="768,354 440,354 440,478" fill="none" stroke="#232F3E" stroke-width="1.5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <!-- GENEVE is only GWLB ⇄ appliances -->
  <line x1="824" y1="346" x2="940" y2="346" stroke="#232F3E" stroke-width="1.5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <text x="896" y="337" font-size="12" text-anchor="middle" fill="#232F3E">GENEVE :6081</text>

  <!-- numbered steps make the order explicit where the main line breaks at the GWLBe branches -->
  <circle cx="306" cy="332" r="10" fill="#232F3E"/><text x="306" y="336" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="574" cy="324" r="10" fill="#232F3E"/><text x="574" y="328" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="840" cy="332" r="10" fill="#232F3E"/><text x="840" y="336" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <circle cx="544" cy="208" r="10" fill="#232F3E"/><text x="544" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <circle cx="544" cy="492" r="10" fill="#232F3E"/><text x="544" y="496" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>

  </g>

  <!-- outside AWS: Users → IGW (IGW at x=216..264) -->
  <line x1="68" y1="346" x2="212" y2="346" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="337" font-size="12" text-anchor="middle" fill="#232F3E">HTTPS :443</text>

  <!-- note panel: full canvas width minus 16px each side (x=16, w=1182), 16px below the AWS Cloud box; step rows 24px apart, first baseline panel.y + 26, canvas ends 16px below the panel -->
  <rect x="16" y="660" width="1182" height="116" fill="#F8F9F9" stroke="#D5DBDB" stroke-width="1"/>
  <circle cx="38" cy="682" r="10" fill="#232F3E"/><text x="38" y="686" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="56" y="686" font-size="12" font-weight="600" fill="#232F3E">IGW → GWLBe</text><text x="165" y="686" font-size="12" fill="#545B64">IGW 엣지 RT가 App 서브넷 CIDR(10.0.1.0/24, 10.0.2.0/24)을 같은 AZ의 GWLBe로 보내, 들어오는 트래픽이 EC2보다 먼저 검사 경로로 갑니다.</text>
  <circle cx="38" cy="706" r="10" fill="#232F3E"/><text x="38" y="710" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="56" y="710" font-size="12" font-weight="600" fill="#232F3E">GWLBe ⇄ GWLB</text><text x="165" y="710" font-size="12" fill="#545B64">GWLBe는 PrivateLink로 보안 VPC의 GWLB에 연결된 엔드포인트로, 받은 패킷을 바꾸지 않고 GWLB에 넘깁니다.</text>
  <circle cx="38" cy="730" r="10" fill="#232F3E"/><text x="38" y="734" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="56" y="734" font-size="12" font-weight="600" fill="#232F3E">GWLB ⇄ 방화벽</text><text x="165" y="734" font-size="12" fill="#545B64">GWLB가 패킷을 GENEVE(6081)로 캡슐화해 ASG의 방화벽에 분산하고, 같은 흐름은 같은 방화벽으로 보냅니다. 허용된 패킷은 GWLB → GWLBe로 돌아옵니다.</text>
  <circle cx="38" cy="754" r="10" fill="#232F3E"/><text x="38" y="758" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="56" y="758" font-size="12" font-weight="600" fill="#232F3E">GWLBe → EC2</text><text x="165" y="758" font-size="12" fill="#545B64">검사를 마친 트래픽은 VPC 로컬 경로로 EC2에 갑니다. 응답은 App RT 0.0.0.0/0 → GWLBe로 다시 검사된 뒤 GWLBe RT 0.0.0.0/0 → IGW로 나갑니다.</text>
</svg>
