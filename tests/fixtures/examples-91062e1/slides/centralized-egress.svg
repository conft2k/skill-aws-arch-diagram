  <g id="note">
    <text x="4" y="491" font-size="12" fill="#545B64">경로 각 VPC는 2 AZ 동일 구성·같은 AZ 경로; App에 IGW 없음. App subnet RT: 기본 → TGW; TGW 연결선은 VPC attachment.</text>
