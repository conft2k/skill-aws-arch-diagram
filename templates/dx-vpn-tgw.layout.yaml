# Starter template: on-premises → Direct Connect (transit VIF) → DX gateway, and Site-to-Site VPN over the Internet as the backup,
# into one Transit Gateway with two route tables: On-prem RT (associated with the DX gateway and VPN attachments) and
# VPC RT (associated with the VPC attachments), each on the TGW's row beside the attachments it is associated with.
# Copy it into your scratchpad and change the lines marked EDIT; every other line already draws cleanly.
# One spec for both media: it passes R-fit as a document (≥ 11px in a 760px column) and as a slide (≥ 10pt), titled or not.
# Eight columns make the canvas ~1000px wide at 12px text (9.1px in a 760px document column):
# text_scale 1.5 makes the text large enough for the document and still fits a slide. Adding a column widens the
# canvas: then raise text_scale (≤ 1.8) or move the VPN path to its own slide.
name: dx-vpn-tgw                        # EDIT: the output stem (<name>.draft.svg)
mode: document                          # document, or slide for a deck (the same spec passes both)
text_scale: 1.5                         # one key for both modes; auto stops short of 11px on a canvas this wide
cols: [dc, link, edge, dxgw, rtop, {id: tgw, min_gap_before: 115}, {id: rtvpc, min_gap_before: 115}, {id: vpc, min_gap_before: 110}]
# link / edge: outside the Cloud (Direct Connect, Internet, VPN); dxgw: in the Cloud, outside the Region;
# rtop / rtvpc: one column per route table, on the side of its attachments; the min_gap_before values keep each
# table's label clear of the TGW's and the VPCs right of VPC RT (columns whose nodes share no row may land on one x)
rows: [top, main, bot]                  # top: the Direct Connect path, bot: the VPN path, main: the TGW and both route tables

groups:
  - {id: onprem, type: onprem, label: On-premises}   # EDIT: the data center name
  - {id: cloud,  type: cloud}
  - {id: region, type: region, label: Region, in: cloud}   # EDIT: keep it short (Seoul); a long title pushes the TGW column right of it

nodes:
  - {id: rtr,  icon: resource/Amazon-VPC_Customer-Gateway, label: Router, sub: 192.168.0.0/16, in: onprem, at: [dc, top]}   # EDIT: the on-premises CIDR
  - {id: cgw,  icon: resource/Amazon-VPC_Customer-Gateway, label: CGW, sub: VPN 장비, in: onprem, at: [dc, bot]}
  - {id: dx,   icon: service/AWS-Direct-Connect, label: Direct Connect, sub: transit VIF, at: [edge, top]}   # outside the Cloud (the loader rejects it inside)
  - {id: inet, icon: resource/Internet, label: Internet, at: [link, bot]}                                  # what the VPN runs over
  - {id: dxgw, icon: resource/AWS-Direct-Connect_Gateway, label: DX gateway, in: cloud, at: [dxgw, top]}   # global: in the Cloud, outside the Region
  - {id: vpn,  icon: service/AWS-Site-to-Site-VPN, label: Site-to-Site VPN, sub: 백업 경로, at: [edge, bot]}   # outside the Cloud (the loader rejects it inside)
  - {id: rtop, icon: resource/Amazon-Route-53_Route-Table, label: On-prem RT, sub: VPC 경로 전파, in: region, at: [rtop, main], for: [dxgw, vpn], via: tgw}   # associated with the DX gateway and VPN attachments; VPC routes propagated
  - {id: tgw,  icon: service/AWS-Transit-Gateway, label: TGW, in: region, at: [tgw, main]}   # a short label: the attachment lines enter its top and bottom 23px either side of center, clear of it
  - {id: rtvpc, icon: resource/Amazon-Route-53_Route-Table, label: VPC RT, sub: DX·VPN 전파, in: region, at: [rtvpc, main], for: [prod, dev], via: tgw}   # associated with the VPC attachments; on-premises routes propagated (DX preferred over VPN)
  - {id: prod, icon: service/Amazon-Virtual-Private-Cloud, label: Prod VPC, sub: 10.1.0.0/16, in: region, at: [vpc, top]}   # EDIT: VPC names and CIDRs
  - {id: dev,  icon: service/Amazon-Virtual-Private-Cloud, label: Dev VPC, sub: 10.2.0.0/16, in: region, at: [vpc, bot]}

edges:                                  # topology: '--' = solid, no arrowheads
  - {e: "rtr -- dx", label: BGP}
  - {e: "dx -- dxgw"}
  - {e: "dxgw -- tgw", verb: DXGW attachment, shape: HV}                       # HV: along the top row, then down into the TGW, so On-prem RT sits inside the bracket of its two lines
  - {e: "cgw -- inet"}
  - {e: "inet -- vpn", label: IPsec}
  - {e: "vpn -- tgw", verb: VPN attachment, shape: HV, to_offset: -23}         # to_offset / from_offset ±23: the bottom lines pass beside the TGW label
  - {e: "tgw -- prod", verb: VPC attachment, shape: VH}                        # VH: up (down) out of the TGW, then across to the VPC, around VPC RT
  - {e: "tgw -- dev", shape: VH, from_offset: 23}
